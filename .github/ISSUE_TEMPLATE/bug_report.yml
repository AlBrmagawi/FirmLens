name: Bug report
description: Report unexpected behavior with a minimal reproducer.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use [private reporting](https://github.com/AlBrmagawi/FirmLens/security/advisories/new).
        Do not include tokens, keys, `.env`, proprietary firmware or unreviewed exports.
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Run git rev-parse --short HEAD in your checkout.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Docker Engine/Desktop and Compose versions, and browser if relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe what you expected and what happened, including the scan outcome if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Prefer the source-built demo or a small synthetic fixture. Include the format and codec for input failures.
      placeholder: |
        1. Start with...
        2. Run or open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Optional doctor output, coverage diagnostics or a short error excerpt. Review for sensitive data first.
      render: text
