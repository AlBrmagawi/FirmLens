name: Validate FirmwareLens
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.30'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts demo
      - run: uv run ruff format --check src tests scripts demo
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run python scripts/generate_types.py && git diff --exit-code frontend/src/generated.ts
      - run: npm ci && npm run lint && npx prettier --check . && npm run build
        working-directory: frontend
      - run: uv run pip-audit
      - run: npm audit --audit-level=high
        working-directory: frontend
      - name: Secret scan (tracked working tree, including new files)
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 dir /repo --config /repo/.gitleaks.toml --redact --no-banner
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/setup.mjs
      - run: docker compose build
      - run: docker compose --profile tools build sandbox demo
      - run: docker build -f Dockerfile.sandbox --target checks -t firmwarelens-checks .
      - run: docker compose up -d
      - name: Wait for verified sandbox readiness
        run: |
          for i in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs --tail 100 api supervisor
          exit 1
      - run: docker compose exec -T api firmwarelens doctor --json
      - run: docker compose --profile tools run --rm demo
      - run: node scripts/verify_reproducibility.mjs
      - run: docker compose exec -T api python scripts/demo_workflow.py
      - run: docker compose exec -T api python scripts/verify_variants.py
      - run: docker compose cp api:/exports/. ./exports
      - name: Validate actual exports against official schemas
        run: docker run --rm --network none -v "$PWD/exports:/app/exports:ro" firmwarelens-checks python scripts/validate_exports.py
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - name: Verify persistence and active cancellation
        run: node scripts/verify_operations.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100 api supervisor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: |
            frontend/playwright-report
            exports/*validation*.json
            exports/demo-results.json
      - if: always()
        run: docker compose down
